schema-version = 1

[package]
title = "Hello World TV"
version = "1.0.0"
id = "com.helloworldtv.app"
icon = "@image/app_icon.png"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

# Exigido pela keplerscript-audio-lib (sons de navegação).
[[needs.privilege]]
id = "com.amazon.audio.privilege.settings.control"

# Teclado virtual do sistema para o campo da tela Buscar.
[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Sons de navegação (AudioPlaybackStream da keplerscript-audio-lib).
[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

# Sons do sistema: o UISoundManager do runtime e a consulta
# areSystemSoundsEnabledAsync dependem deste serviço.
[[wants.service]]
id = "com.amazon.audio.system"

[components]
[[components.interactive]]
id = "com.helloworldtv.app.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
