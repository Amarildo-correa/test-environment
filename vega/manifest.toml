schema-version = 1

[package]
title = "Hello World TV"
version = "1.0.0"
id = "com.helloworldtv.app"
icon = "@image/app_icon.png"

# Desde o SDK 2.0 o build gera o [[needs.module]] /com.amazon.vega.os@IVega_*
# a partir destes valores; não declarar à mão.
[os.version]
min = "2.0"
target = "2.0"

# Teclado virtual do sistema para o campo da tela Buscar.
[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Sons de navegação nativos do Fire TV: o UISoundManager do runtime toca os
# sons de foco, OK e Voltar, mas só com acesso a este serviço.
[[wants.service]]
id = "com.amazon.audio.system"

[components]
[[components.interactive]]
id = "com.helloworldtv.app.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]
