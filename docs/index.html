<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World TV</title>
  <meta name="description" content="Hello World TV é um guia de bolso para quem desenvolve aplicativos para TV.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='48' font-family='Arial,sans-serif' font-size='44' font-weight='800' fill='%23FF6A00' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000000; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      text-align: center;
      color: #F2F2F2;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 {
      margin: 0 0 80px;
      font-size: clamp(48px, 6.25vw, 96px);
      font-weight: 800;
      line-height: 1.1;
    }
    h1 .hello { color: #FF6A00; }
    h1 .world { color: #F2F2F2; }
    .texto { max-width: 900px; }
    .texto p {
      margin: 0 0 1.3em;
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 400;
      line-height: 1.35;
    }
    .texto p:last-child { margin-bottom: 0; }
    /* botão retangular, cantos retos */
    .botao {
      display: inline-block;
      max-width: 100%;
      margin-top: 70px;
      padding: 18px 52px;
      background: #FFFFFF;
      color: #000000;
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 800;
      text-decoration: none;
      border-radius: 0;
    }
    .botao:hover, .botao:focus-visible {
      background: #FF6A00;
      color: #000000;
      outline: 4px solid #FF6A00;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <h1><span class="hello">Hello</span> <span class="world">World</span></h1>
  <div class="texto">
    <p>Hello World TV é um guia de bolso para quem desenvolve aplicativos para TV.</p>
    <p>Todo o app funciona só com o controle remoto: setas, OK e Voltar. As letras são grandes para leitura a distância, e o conteúdo vem dentro do app, sem precisar de internet.</p>
  </div>
  <a class="botao" href="privacidade.html">Política de privacidade</a>
</body>
</html>
