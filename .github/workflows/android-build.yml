# Compila o app Android TV (react-native-tvos) e publica o APK de release.
name: Android TV build

on:
  push:
    branches: [main]
    paths:
      - androidtv/**
      - .github/workflows/android-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: androidtv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: androidtv/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Tipos, lint e testes
        run: |
          npx tsc --noEmit
          npx eslint .
          npx jest

      - name: Gerar APK de release
        working-directory: androidtv/android
        run: ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: hello-world-tv-apk
          path: androidtv/android/app/build/outputs/apk/release/app-release.apk
